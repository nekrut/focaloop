class: GalaxyUserTool
id: focaloop-query
version: "0.2.0"
name: Focaloop Query warm-state instant contrast and sub-cohort comparison
description: Zero-network-byte follow-up differential expression contrast or sub-cohort WHO resistance and Hudson F_ST query guarded by HypothesisLedger
container: ghcr.io/galaxyproject/focaloop:0.2.0
configfiles:
  - name: query_args
    filename: query_args.json
    content: |
      {"contrast": $(JSON.stringify(inputs.contrast)), "actor": $(JSON.stringify(inputs.actor)), "hypothesis": $(JSON.stringify(inputs.hypothesis || "")), "design": $(JSON.stringify(inputs.design || ""))}
    eval_engine: ecmascript
shell_command: |
  focaloop query \
  --state-dir '$(inputs.state.path)' \
  --args-json query_args.json \
  --mode $(inputs.mode) \
  --out-table query_table.tsv \
  --out-verdict verdict.json \
  --out-report query_report.html \
  --out-state-archive focaloop_state.tar.zst
inputs:
  - name: state
    type: data
    format: data
    label: Saved Focaloop state bundle (.focaloop.tar.zst)
  - name: contrast
    type: text
    value: "condition:treated:control"
    label: Contrast or sub-cohort comparison
    help: "PanExpr: condition:AR0387:AR0382 (or A:B). MalariaVar: Population:AS-SE-E:AF-W or Country:Cambodia,Vietnam:Ghana,Mali."
    validators:
      - type: regex
        expression: "^([A-Za-z0-9_]+[:=])?[A-Za-z0-9_,.-]+:[A-Za-z0-9_,.-]+$"
        message: "Use A:B, factor:A:B, or factor=A:B"
  - name: actor
    type: text
    value: human
    label: Actor recorded in HypothesisLedger
    validators:
      - type: regex
        expression: "^(human|agent:[A-Za-z0-9_.-]+)$"
        message: "Use 'human' or 'agent:<name>'"
  - name: hypothesis
    type: text
    optional: true
    label: Specific gene / group to test on holdout (optional; defaults to top discovery hit)
  - name: design
    type: text
    optional: true
    label: Optional Wilkinson formula override for multi-factor PanExpr contrasts (e.g. ~donor + condition)
  - name: mode
    type: select
    options:
      - { label: "Auto-detect from saved state", value: auto, selected: true }
      - { label: "Differential expression contrast", value: contrast, selected: false }
      - { label: "Sub-cohort F_ST and prevalence comparison", value: fst, selected: false }
    label: Query mode
outputs:
  - name: query_table
    type: data
    format: tabular
    from_work_dir: query_table.tsv
    label: "Focaloop Query: query_table.tsv"
  - name: verdict
    type: data
    format: json
    from_work_dir: verdict.json
    label: "Focaloop Query: verdict.json (HypothesisLedger)"
  - name: query_report
    type: data
    format: html
    from_work_dir: query_report.html
    label: "Focaloop Query: query_report.html"
  - name: state_out
    type: data
    format: data
    from_work_dir: focaloop_state.tar.zst
    label: "Focaloop Query: updated state (.focaloop.tar.zst)"
help:
  format: markdown
  content: |
    Executes an instant warm-state follow-up query over any `*.focaloop.tar.zst` bundle from **Focaloop PanExpr**
    or **Focaloop MalariaVar** with network sockets blocked (`0` network bytes downloaded):

    - **On PanExpr state bundles:** Runs a new `PyDESeq2` pairwise or multi-factor contrast with placement-ambiguity
      error propagation, orthology bridge lookup, and reusable-holdout validation.
    - **On MalariaVar state bundles:** Computes sub-cohort WHO drug-resistance & deletion prevalence differences
      (Fisher exact test + BH FDR) alongside genome-wide and per-locus Hudson $F_{ST}$ with label-permutation p-values.

    Every query is recorded in the persisted `HypothesisLedger` (online generalized alpha-investing).
citations:
  - type: doi
    content: 10.1126/science.aaa9375
license: MIT
