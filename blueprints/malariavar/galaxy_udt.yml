class: GalaxyUserTool
id: focaloop-malariavar
version: "0.2.0"
name: Focaloop MalariaVar Plasmodium variation and drug-resistance loop
description: Focused .crai CRAM HTTP range surveillance or raw SRA host-sieved streaming for WHO drug resistance, hrp2/3 deletions, CNVs and F_WS
container: ghcr.io/galaxyproject/focaloop:0.2.0
shell_command: |
  focaloop malariavar \
  --manifest '$(inputs.manifest.path)' \
  $(inputs.ref_fasta ? "--ref-fasta '" + inputs.ref_fasta.path + "'" : '') \
  --mode $(inputs.mode) \
  --target-depth $(inputs.target_depth) \
  --mapper $(inputs.mapper) \
  --state-dir malariavar_state_dir \
  --state-archive malariavar_state.focaloop.tar.zst \
  --out-drm drm_calls.tsv \
  --out-variants variants_summary.tsv \
  --out-report malariavar_report.html
inputs:
  - name: manifest
    type: data
    format: tabular
    label: Isolate manifest (TSV)
    help: "Tab-separated manifest with header: sample_id, country_or_group, source_uri_or_srr[, crai_uri_optional, population, sample_type]. Supports Sanger Pf8 CRAM URLs (Mode A) and raw ERR/SRR accessions (Mode B)."
  - name: ref_fasta
    type: data
    format: [fasta, fasta.gz]
    optional: true
    label: Pf3D7 reference genome FASTA (optional; uses bundled PlasmoDB-54 Pf3D7 if omitted)
  - name: mode
    type: select
    label: Surveillance streaming mode
    options:
      - { label: "Auto-detect per isolate (.cram -> focused_cram, ERR/SRR -> wgs_stream)", value: auto, selected: true }
      - { label: "Mode A: Focused .crai CRAM HTTP Range surveillance (55 curated windows, ~20 MB/isolate)", value: focused_cram, selected: false }
      - { label: "Mode B: Raw SRA/FASTQ streaming + C 31-mer human host sieve + depth stop gate", value: wgs_stream, selected: false }
  - name: target_depth
    type: float
    value: 24.0
    min: 5.0
    max: 100.0
    label: Target median core depth for Mode B stop gate
  - name: mapper
    type: select
    label: Short-read aligner for Mode B raw streaming
    options:
      - { label: "Auto (probe-verified strobealign / minimap2 / bwa-mem2)", value: auto, selected: true }
      - { label: "strobealign", value: strobealign, selected: false }
      - { label: "minimap2", value: minimap2, selected: false }
      - { label: "bwa-mem2", value: bwa-mem2, selected: false }
outputs:
  - name: drm_calls
    type: data
    format: tabular
    from_work_dir: drm_calls.tsv
    label: "Focaloop MalariaVar: drm_calls.tsv"
  - name: variants_summary
    type: data
    format: tabular
    from_work_dir: variants_summary.tsv
    label: "Focaloop MalariaVar: variants_summary.tsv"
  - name: malariavar_report
    type: data
    format: html
    from_work_dir: malariavar_report.html
    label: "Focaloop MalariaVar: malariavar_report.html"
  - name: malariavar_state
    type: data
    format: data
    from_work_dir: malariavar_state.focaloop.tar.zst
    label: "Focaloop MalariaVar: malariavar_state.focaloop.tar.zst"
help:
  format: markdown
  content: |
    Runs the **Focaloop MalariaVar** *Plasmodium falciparum* surveillance and streaming variation loop:

    - **Mode A (`focused_cram`):** Reads each isolate's `.crai` index and fetches ONLY the CRAM containers
      overlapping the 55 curated drug-resistance genes (`kelch13`, `crt`, `dhfr`, `dhps`, `mdr1`, `exo`, `arps10`, `fd`, `mdr2`),
      CNV tandem-duplication breakpoints (`mdr1`, `pm2_pm3`, `gch1`, `crt`), *hrp2/hrp3* diagnostic-escape loci, and
      high-MAF core barcode windows (~20 MB transferred vs ~1–2 GB full CRAM).
    - **Mode B (`wgs_stream`):** Streams raw `ERR*`/`SRR*` clinical reads via `xsra`/HTTPS through a C canonical
      31-mer / PLA human host-depletion sieve on the fly, maps parasite reads, and halts as soon as the stop gate
      reaches target core depth.

    Emits per-isolate WHO antimalarial resistance genotypes (`drm_calls.tsv`), variant allele-depth posteriors
    (`variants_summary.tsv`), a visual surveillance report (`malariavar_report.html`), and a warm cohort state
    bundle (`malariavar_state.focaloop.tar.zst`) for instant sub-cohort prevalence & Hudson $F_{ST}$ queries.
citations:
  - type: doi
    content: 10.12688/wellcomeopenres.18681.1
license: MIT
