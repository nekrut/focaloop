class: GalaxyUserTool
id: focaloop-malariavar
version: "0.1.0"
name: MalariaVar focal-loop cohort variant calling
description: P. falciparum SNP, indel, F_WS, crt/mdr1/gch1/plasmepsin CNV and hrp2/hrp3 deletion calls with a host-decoy k-mer sieve
container: ghcr.io/galaxyproject/focaloop:0.1.0
shell_command: |
  focaloop run \
  --blueprint malariavar \
  --targets '$(inputs.targets.path)' \
  --sample-sheet '$(inputs.sample_sheet.path)' \
  --reads $(inputs.reads.map((d) => "'" + d.path + "'").join(' ')) \
  --variant-sites '$(inputs.sites.path)' \
  --max-bytes $(inputs.max_mb * 1048576) \
  --state-dir focaloop_state \
  --state-archive focaloop_state.tar.zst \
  --out-table variant_table.tsv \
  --out-telemetry telemetry.json
inputs:
  - name: targets
    type: data
    format: fasta
    label: Parasite gene bodies plus host decoy (FASTA)
    help: "Mark host sequences with kind=host_decoy in the header so their reads are sieved out before calling."
  - name: sample_sheet
    type: data
    format: tabular
    label: Sample sheet
    help: "Tab-separated with header: sample, condition[, site, year, ...]. Rows in the same order as the read datasets."
  - name: reads
    type: data
    format: [fastqsanger, fastqsanger.gz]
    multiple: true
    label: Reads, one dataset per sample-sheet row
  - name: sites
    type: data
    format: tabular
    label: Variant sites
    help: "Columns: site_id, target_id, pos (0-based), ref, alt[, kind]. Indels allowed."
  - name: max_mb
    type: integer
    value: 512
    min: 1
    max: 1048576
    label: Byte budget (MiB of compressed input)
outputs:
  - name: variant_table
    type: data
    format: tabular
    from_work_dir: variant_table.tsv
    label: MalariaVar calls
  - name: telemetry
    type: data
    format: json
    from_work_dir: telemetry.json
    label: MalariaVar telemetry and trap codes
  - name: state
    type: data
    format: data
    from_work_dir: focaloop_state.tar.zst
    label: MalariaVar warm state (.tar.zst)
help:
  format: markdown
  content: |
    Runs the `malariavar` focal loop over a cohort: allele-specific 31-mer probes count reference and
    alternate support at each declared SNP/indel, effective depth relative to single-copy controls gives
    copy ratios for crt, mdr1, gch1 and plasmepsin 2/3, hrp2/hrp3 are called deleted below 0.1x, and
    F_WS summarises within-host diversity (values below 0.95 flag polyclonal infections).

    **Inputs** -- `targets`, `sample_sheet`, `reads`, `sites`, `max_mb`.
    **Outputs** -- `variant_table`: one row per sample x feature (`snp`, `indel`, `cnv`, `deletion`,
    `fws`); `telemetry`: tournament + gate metrics + `trap_codes`; `state`: warm state whose allele
    counts feed the spatiotemporal F_ST query tool.

    Host reads matching the decoy are dropped, not counted as unmapped; `LOW_MAP_RATE` uses parasite reads only.
citations:
  - type: doi
    content: 10.1038/nature11174
license: MIT
