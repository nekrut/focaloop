# Pinned conda environment for ghcr.io/galaxyproject/focaloop:0.2.0
name: focaloop
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12
  - numpy>=2.1
  - pandas>=2.2
  - pyarrow>=18.0
  - scipy>=1.14
  - pyyaml>=6.0
  - requests>=2.31
  - pydeseq2>=0.4.12
  - statsmodels>=0.14
  - numba>=0.60
  - mappy>=2.28
  - pysam>=0.22
  - bwa=0.7.19
  - bwa-mem2=2.2.1
  - strobealign=0.14.0
  - minimap2=2.28
  - bowtie2=2.5.4
  - hisat2=2.2.1
  - salmon=1.10.3
  - piscem>=0.10.3
  - samtools=1.21
  - bcftools=1.21
  - htslib=1.21
  - curl
  - zstd
  - pip
# xsra (Tier-2 SRA decoder, `xsra dump -Q -P https`) can be added from release binary or `cargo install xsra`.
