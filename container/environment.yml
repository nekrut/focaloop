# Pinned conda environment for ghcr.io/galaxyproject/focaloop:0.1.0
name: focaloop
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12
  - numpy=2.1.3
  - pandas=2.2.3
  - pyarrow=18.1.0
  - scipy=1.14.1
  - pyyaml=6.0.2
  - bwa=0.7.19          # classic bwa: bwa_spa kernel = bwa mem -S -P -a
  - bwa-mem2=2.2.1
  - strobealign=0.14.0
  - minimap2=2.28
  - bowtie2=2.5.4
  - salmon=1.10.3
  - piscem=0.10.3
  - samtools=1.21
  - bcftools=1.21
  - htslib=1.21
  - pip
# xsra (Tier-2 SRA decoder, `xsra dump -Q -P https`) is not on bioconda; install with
# `cargo install xsra` if wanted. Without it, accessions stream from ENA HTTPS 206.
