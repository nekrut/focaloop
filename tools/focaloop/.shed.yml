categories:
- Sequence Analysis
- RNA
- Variant Analysis
description: Adaptive byte-budgeted streaming loops for RNA-seq expression, genomic variation, and genome annotation.
long_description: |
  Focaloop provides adaptive, byte-budgeted genomics pipelines that stream only the
  reads required to reach statistical convergence across RNA-seq differential expression
  (ExpressionLoop), variant and drug-resistance calling (VariationLoop), eukaryotic
  genome annotation (GeneLoop), and zero-new-byte warm-state hypothesis querying
  (Focaloop Query).
name: focaloop
owner: iuc
homepage_url: https://github.com/nekrut/focaloop
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/focaloop
type: unrestricted
auto_tool_repositories:
  name_template: "{{ tool_id }}"
  description_template: "Wrapper for Focaloop tool: {{ tool_name }}."
suite:
  name: "suite_focaloop"
  description: "A suite of Galaxy tools for Focaloop adaptive streaming genomics (ExpressionLoop, VariationLoop, GeneLoop, Focaloop Query)."
  type: repository_suite_definition
