categories:
- Sequence Analysis
- RNA
- Variant Analysis
- Genome annotation
description: Adaptive streaming genomics tools for RNA-seq differential expression, genomic variant calling, eukaryotic genome annotation, and follow-up result queries.
long_description: |
  Focaloop provides adaptive genomics tools that analyze only the sequencing data
  needed to reach stable biological conclusions across RNA-seq differential
  expression (Focaloop ExpressionLoop), genomic variant calling (Focaloop
  VariationLoop), eukaryotic structural genome annotation (Focaloop GeneLoop),
  and instant follow-up comparisons on saved results without re-downloading reads
  (Focaloop Query).
name: focaloop
owner: iuc
homepage_url: https://github.com/nekrut/focaloop
remote_repository_url: https://github.com/galaxyproject/tools-iuc/tree/main/tools/focaloop
type: unrestricted
auto_tool_repositories:
  name_template: "{{ tool_id }}"
  description_template: "Wrapper for {{ tool_name }}."
suite:
  name: "suite_focaloop"
  description: "Focaloop suite for adaptive RNA-seq differential expression, genomic variant calling, eukaryotic genome annotation, and follow-up queries."
  type: repository_suite_definition
